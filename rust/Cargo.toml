[workspace]
members = ["crates/protocol", "crates/openai-api", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
clap = { version = "4.5.48", features = ["derive"] }
futures-util = "0.3.31"
openai-protocol = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.16"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
